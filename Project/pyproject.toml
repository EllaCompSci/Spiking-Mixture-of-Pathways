[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pygenn",
    "numpy",
    "neurogym",
    "torch>=2.14.1",
    "matplotlib>=3.10.9",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "mnist>=0.2.2",
    "ml-genn",
]

[tool.uv.sources]
pygenn = { path = "genn" }
ml-genn = { path = "ml_genn/ml_genn", editable = true }

# Build PyGeNN against the environment's own build tools
[tool.uv.extra-build-dependencies]
pygenn = ["pkgconfig", "pybind11", "psutil", "numpy", "setuptools", "wheel"]

[project.scripts]
project = "project:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
